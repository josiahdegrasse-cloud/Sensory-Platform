name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: npx pnpm@10 install --frozen-lockfile

      - name: Typecheck
        run: npx pnpm@10 run typecheck

      # Fail if src/app/lib/db/database.types.ts has drifted from the live schema
      # (e.g. a migration was applied without re-running `npm run db:types`). The
      # typed Supabase client only protects code when these types are current.
      # Skips with a warning until SUPABASE_ACCESS_TOKEN is set, so it can't block
      # its own PR. This Supabase CLI setup is shared with the migration-drift
      # guard (Guard 1) further down.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Check database.types.ts is in sync with the schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: golkgpeqenyqrcyawjdt
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping database.types.ts drift check."
            echo "Add it in repo Settings → Secrets and variables → Actions to enable this guard."
            exit 0
          fi
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          npx pnpm@10 run db:types
          if ! git diff --quiet -- src/app/lib/db/database.types.ts; then
            echo "::error::database.types.ts is out of date with the live schema."
            echo "::error::Run 'npm run db:types' and commit the result."
            git diff -- src/app/lib/db/database.types.ts | head -60
            exit 1
          fi
          echo "OK — database.types.ts matches the live schema."

      - name: Lint
        run: npx pnpm@10 run lint

      - name: Test
        run: npx pnpm@10 test

      - name: Validate migrations
        run: |
          test -n "$(find supabase/migrations -name '*.sql' -type f)"
          ! grep -RInE 'DROP (TABLE|SCHEMA).*CASCADE|TRUNCATE ' supabase/migrations

      # Guard 1 (deploy-ordering): fail if the linked project's schema is AHEAD of
      # this branch — i.e. a migration is applied on prod but missing here. That is
      # the shape of the 2026-06-25 outage. Skips (with a warning) until the
      # SUPABASE_ACCESS_TOKEN secret is added, so it can't lock out its own PR.
      # (The Supabase CLI is already set up above for the types-drift check.)
      - name: Check migration drift (prod schema must not be ahead of this branch)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The project ref is not a secret; it appears throughout the repo.
          SUPABASE_PROJECT_REF: golkgpeqenyqrcyawjdt
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping migration drift check."
            echo "Add it in repo Settings → Secrets and variables → Actions to enable Guard 1."
            exit 0
          fi
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          bash scripts/check-migration-drift.sh

      - name: Install browser
        run: npx pnpm@10 exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx pnpm@10 run test:e2e
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Audit production dependencies
        run: npx pnpm@10 audit --prod --audit-level=moderate

      - name: Build
        run: npx pnpm@10 run build
